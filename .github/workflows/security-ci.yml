name: Security & Privacy CI/CD

# Bu iş akışı En Az Yetki Prensibi (Principle of Least Privilege) ile sınırlandırılmıştır.
# Öğrenci: Metehan Gezer (2516016026) - Güvenli Bulut Yayını

on:
  push:
    branches:
      - main
      - secure-cloud-publication
  pull_request:
    branches:
      - main

# KESİN EN AZ YETKİ: Yalnızca kod okuma ve güvenlik SARIF raporu yükleme izni
permissions:
  contents: read
  security-events: write

jobs:
  # ----------------------------------------------------------------------------
  # 1. Gitleaks - Gizli Anahtar ve Kimlik Bilgisi Tarama
  # ----------------------------------------------------------------------------
  gitleaks-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Tarayıcısını Çalıştır
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ----------------------------------------------------------------------------
  # 2. Bağımlılık Güvenlik Denetimi (npm audit)
  # ----------------------------------------------------------------------------
  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: next-app/package-lock.json

      - name: Next.js Bağımlılık Güvenlik Taraması
        working-directory: ./next-app
        run: |
          npm audit --audit-level=high

  # ----------------------------------------------------------------------------
  # 3. Otomasyonlu Gizlilik ve Veri Minimizasyonu Testleri
  # ----------------------------------------------------------------------------
  privacy-tests:
    name: Automated Privacy & Zero-Retention Verification
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: next-app/package-lock.json

      - name: Bağımlılıkları Yükle
        working-directory: ./next-app
        run: npm ci

      - name: Sıfır Kalıcılık (Zero-Retention) ve PII Sızıntı Testlerini Çalıştır
        working-directory: ./next-app
        run: npm run test:privacy

      - name: Canlı Nabız Birim ve Regresyon Testlerini Çalıştır
        working-directory: ./next-app
        run: |
          npm run test:pulse
          npm run test:regression

  # ----------------------------------------------------------------------------
  # 4. Derleme ve Statik Tip Doğrulaması (Next.js Production Build)
  # ----------------------------------------------------------------------------
  build-verification:
    name: Production Build Verification
    runs-on: ubuntu-latest
    needs: [dependency-audit, privacy-tests]
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: next-app/package-lock.json

      - name: Bağımlılıkları Yükle
        working-directory: ./next-app
        run: npm ci

      - name: Next.js Üretim Derlemesi
        working-directory: ./next-app
        env:
          NEXT_TELEMETRY_DISABLED: 1
          DATABASE_URL: postgres://build_user:build_password@127.0.0.1:5432/build_db
        run: npm run build
